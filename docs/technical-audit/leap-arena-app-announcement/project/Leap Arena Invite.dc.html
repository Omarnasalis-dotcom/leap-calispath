<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&family=Archivo+Expanded:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#08080A;}
  @keyframes leapPulse{0%,100%{opacity:.55;}50%{opacity:1;}}
  input::placeholder,textarea::placeholder{color:#5C5C62;}
  input:focus,textarea:focus{outline:none;border-color:rgba(255,86,71,0.7)!important;background:rgba(255,86,71,0.04)!important;}
  a{text-decoration:none;color:inherit;}
</style>
</helmet>
<div style="min-height:100vh; width:100%; background:#08080A; font-family:'Archivo',sans-serif; color:#F4F2F0; display:flex; justify-content:center; padding:56px 24px; position:relative; overflow:hidden;">

  <!-- brand ring backdrop -->
  <div style="position:absolute; top:-260px; left:50%; transform:translateX(-50%); width:1100px; height:1100px; border-radius:50%; background:repeating-radial-gradient(circle, rgba(255,86,71,0.10) 0 2px, transparent 2px 64px); -webkit-mask-image:radial-gradient(circle,#000 0%,#000 36%,transparent 66%); mask-image:radial-gradient(circle,#000 0%,#000 36%,transparent 66%); pointer-events:none;"></div>
  <div style="position:absolute; top:-80px; left:50%; transform:translateX(-50%); width:560px; height:560px; border-radius:50%; background:radial-gradient(circle, rgba(255,86,71,0.18) 0%, rgba(255,86,71,0) 70%); pointer-events:none;"></div>

  <div style="position:relative; width:100%; max-width:560px;">

    <!-- back link -->
    <a href="Leap Arena Landing.dc.html" style="display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:#9A9AA0; margin-bottom:36px;">&larr; Back to home</a>

    <!-- header -->
    <div style="text-align:center; margin-bottom:48px;">
      <div style="display:inline-flex; align-items:center; gap:14px; margin-bottom:10px;">
        <img src="assets/leap-logo.png" alt="LEAP" style="height:40px; width:auto; mix-blend-mode:screen;">
        <span style="font-family:'Archivo Expanded',sans-serif; font-weight:700; font-size:18px; letter-spacing:0.42em; padding-left:5px;">ARENA</span>
      </div>
      <div style="font-family:'Archivo Expanded',sans-serif; font-weight:600; font-size:13px; letter-spacing:0.38em; color:#FF5647;">CALISTHENICS</div>
      <h1 style="font-family:'Archivo Expanded',sans-serif; font-weight:900; font-size:46px; letter-spacing:-0.01em; text-transform:uppercase; margin-top:30px;">Join the Queue</h1>
      <p style="font-size:17px; line-height:1.55; color:#9A9AA0; max-width:400px; margin:18px auto 0;">Enter your details to request an exclusive invite code to the Arena.</p>
    </div>

    <!-- card / form -->
    <form onSubmit="{{ handleSubmit }}" style="display:flex; flex-direction:column; gap:26px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.07); border-radius:24px; padding:40px 36px;">

      <div style="display:flex; flex-direction:column; gap:11px;">
        <label style="font-family:'Archivo Expanded',sans-serif; font-weight:700; font-size:12px; letter-spacing:0.16em; color:#C9C9CF;">FULL NAME</label>
        <input name="full_name" type="text" required="{{ true }}" placeholder="Alex Warrior" style="height:56px; padding:0 18px; font-size:16px; font-family:'Archivo',sans-serif; color:#F4F2F0; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:14px; transition:border-color .15s ease, background .15s ease;">
      </div>

      <div style="display:flex; flex-direction:column; gap:11px;">
        <label style="font-family:'Archivo Expanded',sans-serif; font-weight:700; font-size:12px; letter-spacing:0.16em; color:#C9C9CF;">EMAIL ADDRESS</label>
        <input name="email" type="email" required="{{ true }}" placeholder="warrior@email.com" style="height:56px; padding:0 18px; font-size:16px; font-family:'Archivo',sans-serif; color:#F4F2F0; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:14px; transition:border-color .15s ease, background .15s ease;">
      </div>

      <div style="display:flex; flex-direction:column; gap:11px;">
        <label style="font-family:'Archivo Expanded',sans-serif; font-weight:700; font-size:12px; letter-spacing:0.16em; color:#C9C9CF;">INSTAGRAM (OPTIONAL)</label>
        <input name="instagram" type="text" placeholder="@alex_warrior" style="height:56px; padding:0 18px; font-size:16px; font-family:'Archivo',sans-serif; color:#F4F2F0; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:14px; transition:border-color .15s ease, background .15s ease;">
      </div>

      <div style="display:flex; flex-direction:column; gap:11px;">
        <label style="font-family:'Archivo Expanded',sans-serif; font-weight:700; font-size:12px; letter-spacing:0.16em; color:#C9C9CF;">MOBILE NUMBER (OPTIONAL)</label>
        <input name="mobile" type="tel" placeholder="+1 (234) 567-8900" style="height:56px; padding:0 18px; font-size:16px; font-family:'Archivo',sans-serif; color:#F4F2F0; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:14px; transition:border-color .15s ease, background .15s ease;">
      </div>

      <div style="display:flex; flex-direction:column; gap:13px;">
        <label style="font-family:'Archivo Expanded',sans-serif; font-weight:700; font-size:12px; letter-spacing:0.16em; color:#C9C9CF;">EXPERIENCE LEVEL</label>
        {{ levelControl }}
      </div>

      <div style="display:flex; flex-direction:column; gap:11px;">
        <label style="font-family:'Archivo Expanded',sans-serif; font-weight:700; font-size:12px; letter-spacing:0.16em; color:#C9C9CF;">WHY DO YOU WANT TO ENTER THE ARENA?</label>
        <textarea name="reason" rows="4" placeholder="Tell us about your calisthenics goals..." style="padding:16px 18px; font-size:16px; font-family:'Archivo',sans-serif; color:#F4F2F0; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:14px; resize:vertical; min-height:120px; transition:border-color .15s ease, background .15s ease;"></textarea>
      </div>

      <button type="submit" style="height:60px; margin-top:6px; border:none; cursor:pointer; border-radius:16px; background:#FF5647; box-shadow:0 20px 48px -14px rgba(255,86,71,0.6); font-family:'Archivo Expanded',sans-serif; font-weight:900; font-size:17px; letter-spacing:0.06em; text-transform:uppercase; color:#0A0A0B; transition:transform .18s ease, background .18s ease;" style-hover="background:#FF6B5E; transform:translateY(-2px);" style-active="transform:translateY(0);">Request Invite Code</button>

      <sc-if value="{{ submitted }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex; align-items:center; gap:12px; padding:16px 18px; border-radius:14px; background:rgba(255,86,71,0.1); border:1px solid rgba(255,86,71,0.4);">
          <span style="width:9px; height:9px; border-radius:50%; background:#FF5647; box-shadow:0 0 12px 2px rgba(255,86,71,0.9); animation:leapPulse 1.8s ease-in-out infinite; flex-shrink:0;"></span>
          <span style="font-size:15px; color:#FFC9C2;">You're in the queue. We'll email your invite code soon.</span>
        </div>
      </sc-if>
    </form>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:620,&quot;height&quot;:1100}}">
class Component extends DCLogic {
  state = { level: 'Beginner', submitted: false };

  renderVals() {
    const active = this.state.level;
    const baseStyle = {
      flex: 1, height: '52px', cursor: 'pointer', borderRadius: '12px',
      fontFamily: "'Archivo Expanded',sans-serif", fontWeight: 700, fontSize: '13px',
      letterSpacing: '0.1em', textTransform: 'uppercase', transition: 'all .15s ease'
    };
    const styleFor = (label) => label === active
      ? { ...baseStyle, background: '#FF5647', color: '#0A0A0B', border: '1px solid #FF5647', boxShadow: '0 8px 24px -8px rgba(255,86,71,0.7)' }
      : { ...baseStyle, background: 'rgba(255,255,255,0.03)', color: '#9A9AA0', border: '1px solid rgba(255,255,255,0.12)' };

    const levelControl = React.createElement(
      'div',
      { style: { display: 'flex', gap: '12px' } },
      ['Beginner', 'Intermediate', 'Advanced'].map(label =>
        React.createElement('button', {
          key: label + (label === active ? '-on' : '-off'),
          type: 'button',
          style: styleFor(label),
          onClick: () => this.setState({ level: label })
        }, label)
      )
    );

    return {
      levelControl,
      submitted: this.state.submitted,
      handleSubmit: (e) => {
        e.preventDefault();
        // Wire this to your backend endpoint. Selected level: this.state.level
        this.setState({ submitted: true });
      }
    };
  }
}
</script>
</body>
</html>
