<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval' 'unsafe-inline';">
  <title>Leap CalisPath</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #root {
      display: flex;
      width: 100%;
      height: 100%;
    }
    .expo-loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
    }
    .expo-loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(205, 127, 50, 0.3);
      border-top: 4px solid #CD7F32;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .expo-loading-text {
      color: #CD7F32;
      margin-top: 20px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div class="expo-loading" id="expo-loading">
    <div class="expo-loading-spinner"></div>
    <div class="expo-loading-text">LEAP CALISPATH</div>
  </div>
  <script>
    // Hide loading screen when app is ready
    window.addEventListener('load', function() {
      setTimeout(function() {
        const loading = document.getElementById('expo-loading');
        if (loading) {
          loading.style.opacity = '0';
          setTimeout(function() {
            loading.style.display = 'none';
          }, 300);
        }
      }, 1000);
    });
  </script>
</body>
</html>
